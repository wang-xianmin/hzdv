<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>扫码确认</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #fff;
      --text: #1a1a1a;
      --muted: #666;
      --ok: #2b8a3e;
      --err: #c92a2a;
      --accent: #3d6a96;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: min(420px, 100%);
      background: var(--card);
      border-radius: 16px;
      padding: 28px 22px 32px;
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 20px;
      font-weight: 700;
    }
    p {
      margin: 0;
      font-size: 14px;
      line-height: 1.55;
      color: var(--muted);
    }
    #turnstileMount {
      margin: 18px auto 0;
      display: flex;
      justify-content: center;
      min-height: 65px;
    }
    .status {
      margin-top: 18px;
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      min-height: 1.5em;
    }
    .status.is-ok { color: var(--ok); }
    .status.is-err { color: var(--err); }
    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: #999;
    }
  </style>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>
  <div class="card">
    <h1>扫码登录确认</h1>
    <p id="desc">请先完成人机验证；通过后才会通知电脑端发送确认邮件。</p>
    <div id="turnstileMount" aria-label="人机验证"></div>
    <p class="status" id="status">加载验证组件…</p>
    <p class="hint" id="hint"></p>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var sessionId =
        params.get("sessionId") ||
        params.get("sessionid") ||
        params.get("key") ||
        "";
      var statusEl = document.getElementById("status");
      var descEl = document.getElementById("desc");
      var hintEl = document.getElementById("hint");
      var mountEl = document.getElementById("turnstileMount");
      var posting = false;
      var widgetId = null;

      function setStatus(text, kind) {
        statusEl.textContent = text || "";
        statusEl.classList.remove("is-ok", "is-err");
        if (kind) statusEl.classList.add("is-" + kind);
      }

      if (!sessionId) {
        descEl.textContent = "链接无效：缺少 sessionId。";
        setStatus("请返回电脑端重新扫码", "err");
        return;
      }

      hintEl.textContent = "会话：" + sessionId.slice(0, 8) + "…";

      function postScanned(turnstileToken) {
        if (posting) return;
        posting = true;
        setStatus("验证通过，正在回传扫码结果…", "");
        fetch("/api/scan-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          cache: "no-store",
          body: JSON.stringify({
            sessionId: sessionId,
            turnstileToken: turnstileToken || "",
            data: {
              scanned: true,
              scannedAt: Date.now(),
              ua: navigator.userAgent || "",
            },
          }),
        })
          .then(function (r) {
            return r.text().then(function (text) {
              var j = null;
              if (text) {
                try {
                  j = JSON.parse(text);
                } catch (e) {}
              }
              return { ok: r.ok, status: r.status, j: j, text: text };
            });
          })
          .then(function (x) {
            if (x.ok && x.j && x.j.success === true) {
              if (mountEl) mountEl.style.display = "none";
              descEl.textContent = "扫码已成功回传到电脑端。";
              setStatus("请查收邮箱，并点击邮件里的「确认登录」", "ok");
              return;
            }
            posting = false;
            var msg =
              (x.j && (x.j.msg || x.j.error)) ||
              ("HTTP " + x.status);
            descEl.textContent = "扫码结果未能写入服务器，请重试人机验证。";
            setStatus(msg, "err");
            if (x.status === 503) {
              hintEl.textContent = "服务器未配置完整，请联系管理员。";
            }
            if (widgetId !== null && window.turnstile) {
              try {
                window.turnstile.reset(widgetId);
              } catch (e) {}
            }
          })
          .catch(function (err) {
            posting = false;
            descEl.textContent = "网络异常，未能回传扫码结果。";
            setStatus(String((err && err.message) || err || "网络错误"), "err");
            if (widgetId !== null && window.turnstile) {
              try {
                window.turnstile.reset(widgetId);
              } catch (e) {}
            }
          });
      }

      function renderTurnstile(siteKey) {
        function tryRender() {
          if (!window.turnstile) {
            setTimeout(tryRender, 80);
            return;
          }
          setStatus("请勾选「确认您是真人」", "");
          widgetId = window.turnstile.render(mountEl, {
            sitekey: siteKey,
            callback: function (token) {
              postScanned(token);
            },
            "error-callback": function () {
              setStatus("人机验证组件出错，请刷新重试", "err");
            },
            "expired-callback": function () {
              posting = false;
              setStatus("验证已过期，请重新勾选", "err");
            },
          });
        }
        tryRender();
      }

      fetch("/api/turnstile-config", { method: "GET", cache: "no-store" })
        .then(function (r) {
          return r.json().then(function (j) {
            return { ok: r.ok, j: j };
          });
        })
        .then(function (x) {
          if (!x.ok || !x.j || !x.j.success || !x.j.siteKey) {
            descEl.textContent = "无法加载人机验证配置。";
            setStatus(
              (x.j && x.j.error) || "TURNSTILE_SITE_KEY 未配置",
              "err"
            );
            return;
          }
          renderTurnstile(x.j.siteKey);
        })
        .catch(function (err) {
          descEl.textContent = "无法加载人机验证配置。";
          setStatus(String((err && err.message) || err || "网络错误"), "err");
        });
    })();
  </script>
</body>
</html>
