<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>扫码确认</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f4f6f8;
      color: #1a1a1a;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
    }
    .msg {
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      color: #2b8a3e;
      line-height: 1.5;
    }
    .msg.is-err { color: #c92a2a; }
    .msg.is-pending { color: #666; font-weight: 500; }
  </style>
</head>
<body>
  <p class="msg is-pending" id="status"></p>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var sessionId =
        params.get("sessionId") ||
        params.get("sessionid") ||
        params.get("key") ||
        "";
      var lang = String(params.get("lang") || "zh").toLowerCase();
      var isEn = lang.indexOf("en") === 0;
      var phone = String(params.get("p") || "").trim();
      var email = String(params.get("e") || "").trim();
      var statusEl = document.getElementById("status");

      function t(zh, en) {
        return isEn ? en : zh;
      }

      function setStatus(text, kind) {
        statusEl.textContent = text || "";
        statusEl.className = "msg" + (kind ? " is-" + kind : "");
      }

      document.documentElement.lang = isEn ? "en" : "zh-CN";

      if (!sessionId) {
        setStatus(t("链接无效", "Invalid link"), "err");
        return;
      }

      setStatus(t("请稍候…", "Please wait…"), "pending");

      var payload = {
        sessionId: sessionId,
        data: {
          scanned: true,
          scannedAt: Date.now(),
          ua: navigator.userAgent || "",
          lang: isEn ? "en" : "zh",
          siteOrigin: window.location.origin || "",
        },
      };
      if (phone) payload.data.phone = phone;
      if (email) payload.data.email = email;

      fetch("/api/scan-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        cache: "no-store",
        body: JSON.stringify(payload),
      })
        .then(function (r) {
          return r.text().then(function (text) {
            var j = null;
            if (text) {
              try {
                j = JSON.parse(text);
              } catch (e) {}
            }
            return { ok: r.ok, status: r.status, j: j };
          });
        })
        .then(function (x) {
          if (x.ok && x.j && x.j.success === true) {
            setStatus(t("请回到电脑查看提示", "Check the computer"), "ok");
            return;
          }
          var msg =
            (x.j && (x.j.msg || x.j.error)) ||
            ("HTTP " + x.status);
          setStatus(msg, "err");
        })
        .catch(function (err) {
          setStatus(String((err && err.message) || err || "network error"), "err");
        });
    })();
  </script>
</body>
</html>
