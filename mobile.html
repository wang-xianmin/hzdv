<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>扫码登录</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #fff;
      --text: #1a1a1a;
      --muted: #666;
      --ok: #2b8a3e;
      --err: #c92a2a;
      --accent: #3d6a96;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: min(420px, 100%);
      background: var(--card);
      border-radius: 16px;
      padding: 28px 22px 32px;
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 20px;
      font-weight: 700;
    }
    p {
      margin: 0;
      font-size: 14px;
      line-height: 1.55;
      color: var(--muted);
    }
    .status {
      margin-top: 18px;
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      min-height: 1.5em;
    }
    .status.is-ok { color: var(--ok); }
    .status.is-err { color: var(--err); }
    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">扫码登录</h1>
    <p id="desc">正在通知电脑端…</p>
    <p class="status" id="status">请稍候</p>
    <p class="hint" id="hint"></p>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var sessionId =
        params.get("sessionId") ||
        params.get("sessionid") ||
        params.get("key") ||
        "";
      var lang = String(params.get("lang") || "zh").toLowerCase();
      var isEn = lang.indexOf("en") === 0;
      var titleEl = document.getElementById("title");
      var statusEl = document.getElementById("status");
      var descEl = document.getElementById("desc");
      var hintEl = document.getElementById("hint");

      function t(zh, en) {
        return isEn ? en : zh;
      }

      function setStatus(text, kind) {
        statusEl.textContent = text || "";
        statusEl.classList.remove("is-ok", "is-err");
        if (kind) statusEl.classList.add("is-" + kind);
      }

      titleEl.textContent = t("扫码登录", "Scan to sign in");
      document.documentElement.lang = isEn ? "en" : "zh-CN";

      if (!sessionId) {
        descEl.textContent = t("链接无效：缺少 sessionId。", "Invalid link: missing sessionId.");
        setStatus(t("请返回电脑端重新扫码", "Please scan again on the computer"), "err");
        return;
      }

      hintEl.textContent =
        t("会话：", "Session: ") + sessionId.slice(0, 8) + "…";

      function showReject(pcStatus, data) {
        titleEl.textContent = t("无法继续", "Cannot continue");
        if (pcStatus === "reject_empty") {
          descEl.textContent = t(
            "电脑端未填写完整。",
            "The computer form is incomplete."
          );
          setStatus(
            (isEn && data && data.rejectMsgEn) ||
              (data && data.rejectMsgZh) ||
              t("手机号、邮箱不能为空！", "Phone and email are required!"),
            "err"
          );
          return;
        }
        if (pcStatus === "reject_email") {
          descEl.textContent = t(
            "电脑端邮箱格式有误。",
            "Invalid email on the computer."
          );
          setStatus(
            (isEn && data && data.rejectMsgEn) ||
              (data && data.rejectMsgZh) ||
              t("邮箱格式不正确", "Invalid email format"),
            "err"
          );
          return;
        }
        if (pcStatus === "reject_send") {
          descEl.textContent = t(
            "电脑端未能发送确认邮件。",
            "The computer could not send the confirmation email."
          );
          setStatus(
            (isEn && data && data.rejectMsgEn) ||
              (data && data.rejectMsgZh) ||
              t("发送失败，请回到电脑端重试", "Send failed. Retry on the computer."),
            "err"
          );
          return;
        }
        descEl.textContent = t("电脑端已拒绝本次扫码。", "The computer rejected this scan.");
        setStatus(String(pcStatus || t("已取消", "Cancelled")), "err");
      }

      function showNotified() {
        titleEl.textContent = t("扫码成功", "Scan successful");
        descEl.textContent = t("已通知电脑端。", "The computer has been notified.");
        setStatus(t("等待电脑端确认…", "Waiting for the computer…"), "");
      }

      function showProcessing() {
        titleEl.textContent = t("扫码成功", "Scan successful");
        descEl.textContent = t("已通知电脑端。", "The computer has been notified.");
        setStatus(t("电脑端处理中…", "Computer is processing…"), "");
      }

      function showOk() {
        titleEl.textContent = t("扫码成功", "Scan successful");
        descEl.textContent = t("已通知电脑端。", "The computer has been notified.");
        setStatus(
          t(
            "请查收邮箱，并在邮件中点击「确认登录」",
            "Check your email and confirm sign-in."
          ),
          "ok"
        );
      }

      var pollCount = 0;
      var maxPolls = 90;
      var finished = false;

      function pollPcStatus() {
        if (finished) return;
        pollCount += 1;
        if (pollCount > maxPolls) {
          finished = true;
          descEl.textContent = t(
            "等待电脑端响应超时。",
            "Timed out waiting for the computer."
          );
          setStatus(
            t("请确认电脑端已打开登录窗口后重新扫码", "Open the login window on the computer and scan again"),
            "err"
          );
          return;
        }
        fetch(
          "/api/scan-login?sessionId=" +
            encodeURIComponent(sessionId) +
            "&_t=" +
            Date.now(),
          { cache: "no-store" }
        )
          .then(function (r) {
            return r.json();
          })
          .then(function (j) {
            if (finished) return;
            var d = (j && j.data) || {};
            var st = String(d.pcStatus || "");
            if (st.indexOf("reject_") === 0) {
              finished = true;
              showReject(st, d);
              return;
            }
            if (st === "ok" || d.emailSent === true) {
              finished = true;
              showOk();
              return;
            }
            if (st === "processing") {
              showProcessing();
            }
            setTimeout(pollPcStatus, 400);
          })
          .catch(function () {
            if (!finished) setTimeout(pollPcStatus, 800);
          });
      }

      descEl.textContent = t("正在通知电脑端…", "Notifying the computer…");
      setStatus(t("请稍候", "Please wait"), "");

      fetch("/api/scan-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        cache: "no-store",
        body: JSON.stringify({
          sessionId: sessionId,
          data: {
            scanned: true,
            mobileConfirmed: true,
            awaitingPc: true,
            scannedAt: Date.now(),
            ua: navigator.userAgent || "",
          },
        }),
      })
        .then(function (r) {
          return r.text().then(function (text) {
            var j = null;
            if (text) {
              try {
                j = JSON.parse(text);
              } catch (e) {}
            }
            return { ok: r.ok, status: r.status, j: j };
          });
        })
        .then(function (x) {
          if (x.ok && x.j && x.j.success === true) {
            // 与原先一致：POST 成功立刻显示扫码成功；查收邮箱等电脑端 ok
            showNotified();
            pollPcStatus();
            return;
          }
          var msg =
            (x.j && (x.j.msg || x.j.error)) ||
            ("HTTP " + x.status);
          descEl.textContent = t("未能通知电脑端。", "Could not notify the computer.");
          setStatus(msg, "err");
          if (x.status === 503) {
            hintEl.textContent = t(
              "服务器 KV 未配置，请联系管理员。",
              "Server KV is not configured."
            );
          }
        })
        .catch(function (err) {
          descEl.textContent = t(
            "网络异常，未能通知电脑端。",
            "Network error. Could not notify the computer."
          );
          setStatus(String((err && err.message) || err || "network error"), "err");
        });
    })();
  </script>
</body>
</html>
