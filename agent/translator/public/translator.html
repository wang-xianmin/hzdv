<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>面对面翻译 · HZDV</title>
  <link rel="stylesheet" href="translator.css?v=20260731a" />
</head>
<body>
  <div class="tr-app" id="trApp">
    <header class="tr-header">
      <a class="tr-back" href="../../../index.html">← 返回</a>
      <h1>面对面翻译</h1>
      <p class="tr-sub">按住说话，松手后先出原文，译文流式生成并按句朗读</p>
    </header>

    <div class="tr-gate" id="trGate" hidden>
      <p id="trGateMsg">请先登录后再使用口译功能。</p>
      <a class="tr-link" href="../../../index.html">去登录</a>
    </div>

    <main class="tr-main" id="trMain" hidden>
      <div class="tr-display-bar">
        <span>显示</span>
        <div class="tr-seg" role="group" aria-label="显示语言">
          <button type="button" class="tr-seg-btn is-on" data-display="both">双语</button>
          <button type="button" class="tr-seg-btn" data-display="zh">中文</button>
          <button type="button" class="tr-seg-btn" data-display="en">英文</button>
        </div>
        <label class="tr-speak-toggle">
          <input type="checkbox" id="trSpeakOn" checked />
          朗读
        </label>
      </div>

      <section class="tr-panel" id="trPanel">
        <div class="tr-bubble tr-src" id="trSrc" hidden>
          <div class="tr-label" id="trSrcLabel">原文</div>
          <p id="trSrcText"></p>
        </div>
        <div class="tr-bubble tr-dst" id="trDst" hidden>
          <div class="tr-label" id="trDstLabel">译文</div>
          <p id="trDstText"></p>
        </div>
        <p class="tr-status" id="trStatus">按住下方按钮开始</p>
      </section>

      <div class="tr-pads">
        <button
          type="button"
          class="tr-ptt tr-ptt-me"
          id="trPttMe"
          aria-label="我说：按住说中文"
        >
          <span class="tr-ptt-title">我说</span>
          <span class="tr-ptt-hint">按住 · 中文→英文</span>
        </button>
        <button
          type="button"
          class="tr-ptt tr-ptt-them"
          id="trPttThem"
          aria-label="对方说：按住录对方"
        >
          <span class="tr-ptt-title">对方说</span>
          <span class="tr-ptt-hint">按住 · 英文→中文</span>
        </button>
      </div>
    </main>
  </div>
  <script src="translator.js?v=20260731a"></script>
</body>
</html>
